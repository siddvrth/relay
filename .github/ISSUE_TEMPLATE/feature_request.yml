name: Feature request
description: Propose a Codex CLI workflow, runtime behavior, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime behavior
        - Codex CLI workflow
        - Documentation
        - Validation
        - Artifact hygiene
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Preserves auto-only PreCompact and fail-open native compaction
        - label: Does not require committing raw runtime state
        - label: Keeps the supported product surface CLI-only
